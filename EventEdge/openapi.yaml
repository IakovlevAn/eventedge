openapi: 3.0.3
info:
  title: EventEdge API
  version: 0.1.0
  description: |
    API-first contract for the EventEdge MVP.

    All timestamps are UTC RFC 3339. News signals are stored per event. The history
    endpoint compares consecutive stored decisions and does not claim causal revisions.
  contact:
    name: EventEdge team
servers:
  - url: https://api.eventedge.example
    description: Production placeholder

tags:
  - name: Signals
  - name: Evals
  - name: News
  - name: Sources
  - name: Events
  - name: Instruments
  - name: Jobs
  - name: Feedback
  - name: Internal ingestion
  - name: Admin
  - name: Health

security:
  - bearerAuth: []

paths:
  /v1/assessments:
    get:
      tags: [Signals]
      summary: List separate news signals, market context and volatility scenarios
      operationId: listAssessments
      security: []
      parameters:
        - name: tickers
          in: query
          description: Optional comma-separated list of up to 20 MOEX tickers.
          schema:
            type: string
            maxLength: 260
      responses:
        '200':
          description: Backward-compatible assessments with explicit independent news_signal, market_context and market_scenario layers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/evals:
    get:
      tags: [Evals]
      summary: Evaluate stored signals and news-materiality predictions
      operationId: listEvals
      security: []
      parameters:
        - name: model_version
          in: query
          description: Model epoch to show. Defaults to the current news model when available.
          schema:
            type: string
            pattern: '^[a-z0-9._-]{3,80}$'
        - name: config_version
          in: query
          description: Exact scoring configuration within the selected model epoch.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: >-
            Outcomes for every stored signal, aggregate all-signal metrics,
            separate live/retrospective cohorts and current news-materiality
            quality against four-hour abnormal returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalResponse'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/evals/export:
    get:
      tags: [Evals]
      summary: Export outcomes or event-time observations for external analysis
      operationId: exportEvals
      security: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: dataset
          in: query
          description: >-
            Outcomes are one row per signal_id; timeseries is one row per candle.
            Eligibility is retained as an audit cohort and does not remove rows.
          schema:
            type: string
            enum: [outcomes, timeseries]
            default: outcomes
        - name: model_version
          in: query
          description: Export one model epoch or all retained epochs.
          schema:
            type: string
            default: all
            pattern: '^(all|[a-z0-9._-]{3,80})$'
        - name: config_version
          in: query
          description: Optional exact configuration version.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Page size for API reads.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 1000
        - name: cursor
          in: query
          description: >-
            next_cursor from the previous page. Outcomes retain a numeric offset;
            timeseries uses an opaque stable keyset cursor.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: download
          in: query
          description: >-
            Return complete outcomes when they fit. Large timeseries exports must
            use pagination because API Gateway cannot return the full raw corpus
            in one response.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Downloadable analytical dataset.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '413':
          description: Timeseries is too large for one response; use next_cursor pagination.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/news:
    get:
      tags: [News]
      summary: List product-relevant source news with related signals
      operationId: listNews
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{2,63}$'
        - name: scope
          in: query
          description: Independent event scope; no propagation between levels is implied.
          schema:
            type: string
            enum: [market, sector, company]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
      responses:
        '200':
          description: >-
            Routed or signal-backed news. The default order is `published_at DESC,
            id DESC`; when materiality rank mode is enabled, completed in-domain
            predictions rerank only comparable slots within one UTC publication day.
            Fresh, pending and out-of-domain rows keep their freshness positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/sources:
    get:
      tags: [Sources]
      summary: List the live source registry and collection status
      operationId: listLiveSources
      security: []
      responses:
        '200':
          description: Static and UI-managed sources with observed content freshness. Freshness is based on stored publications and is not collector uptime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSourceRegistryResponse'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/sources/telegram:
    post:
      tags: [Sources]
      summary: Add a validated public Telegram channel to the fast lane
      operationId: createTelegramSource
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel]
              properties:
                channel:
                  type: string
                  pattern: '^@?[A-Za-z0-9_]{3,48}$'
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 80
                description:
                  type: string
                  minLength: 8
                  maxLength: 280
      responses:
        '201':
          description: Telegram source persisted in YDB.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/admin/signals/reprocess:
    post:
      tags: [Signals]
      summary: Reprocess stored news with the current candidate and signal model
      operationId: reprocessSignalCandidates
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 12
                news_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                tickers:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                  description: Optional supported MOEX company filter, normalized to uppercase.
                dry_run:
                  type: boolean
                  default: true
                  description: Preview candidates without writes or LLM calls. Set false explicitly to execute.
      responses:
        '200':
          description: Budget-capped batch result and remaining candidate count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/signals:
    get:
      tags: [Signals]
      summary: List canonical current signals or stored audit signals
      operationId: listSignals
      parameters:
        - $ref: '#/components/parameters/TickerQuery'
        - name: direction
          in: query
          description: Filter the canonical current signal; never revives an older direction.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SignalDirection'
          style: form
          explode: false
        - name: status
          in: query
          description: Active returns at most the newest signal per ticker; pass another status for audit views.
          schema:
            $ref: '#/components/schemas/SignalStatus'
        - name: min_confidence
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
        - name: model_version
          in: query
          description: Select one immutable news-model epoch. Active view defaults to current.
          schema:
            type: string
            pattern: '^[a-z0-9._-]{3,80}$'
        - name: active_at
          in: query
          description: Return signals active at this instant. Defaults to now.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active signals are newest-per-ticker and ordered by `as_of DESC, id DESC`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalListResponse'
        '304':
          description: The cached representation is still current.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/signals/history:
    get:
      tags: [Signals]
      summary: List chronological news-signal changes for one ticker
      description: Compares consecutive stored news-event decisions. Factor deltas are arithmetic differences, not causal claims.
      operationId: listSignalHistory
      parameters:
        - $ref: '#/components/parameters/TickerQueryRequired'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Stored news-signal events ordered by `as_of DESC, created_at DESC, id DESC`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalHistoryResponse'
        '304':
          description: The cached representation is still current.
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/signals/{signal_id}:
    parameters:
      - $ref: '#/components/parameters/SignalId'
    get:
      tags: [Signals]
      summary: Get one stored news-event signal
      operationId: getSignal
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Stored news-event signal.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '304':
          description: The cached representation is still current.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/signals/{signal_id}/feedback:
    parameters:
      - $ref: '#/components/parameters/SignalId'
    post:
      tags: [Feedback]
      summary: Record an analyst decision about a signal
      operationId: createSignalFeedback
      x-required-role: analyst
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Feedback was recorded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/events:
    get:
      tags: [Events]
      summary: List product-relevant normalized news events
      operationId: listEvents
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [market, sector, company]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Events ordered by `event_time DESC, id DESC`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get a normalized event and its evidence
      operationId: getEvent
      responses:
        '200':
          description: Normalized event.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/instruments/{ticker}/snapshot:
    parameters:
      - $ref: '#/components/parameters/TickerPath'
    get:
      tags: [Instruments]
      summary: Get the current instrument state
      operationId: getInstrumentSnapshot
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Point-in-time instrument snapshot.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentSnapshotResponse'
        '304':
          description: The cached representation is still current.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/instruments/{ticker}/candles:
    parameters:
      - $ref: '#/components/parameters/TickerPath'
    get:
      tags: [Instruments]
      summary: Get intraday MOEX candles
      operationId: getInstrumentCandles
      parameters:
        - name: interval
          in: query
          schema:
            type: integer
            enum: [10]
            default: 10
        - name: lookback_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
            default: 14
      responses:
        '200':
          description: Intraday OHLCV candles and refresh guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentCandlesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/instruments/snapshots:
    get:
      tags: [Instruments]
      summary: Get current state for several instruments
      operationId: listInstrumentSnapshots
      parameters:
        - name: tickers
          in: query
          required: true
          description: One to twenty unique comma-separated MOEX tickers.
          schema:
            type: string
            minLength: 1
            maxLength: 260
            example: SBER,LKOH,YDEX
      responses:
        '200':
          description: Available snapshots and per-instrument errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentSnapshotListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/internal/news:
    post:
      tags: [Internal ingestion]
      summary: Submit one source document for asynchronous processing
      operationId: ingestNews
      x-required-role: ingestor
      security:
        - serviceApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsIngestRequest'
      responses:
        '202':
          description: The document was accepted or previously accepted with the same idempotency key.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URL of the asynchronous job.
              schema:
                type: string
                format: uri-reference
            Idempotency-Replayed:
              description: Present and equal to true when the same command was accepted earlier.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      summary: Get asynchronous operation status
      operationId: getJob
      responses:
        '200':
          description: Current job state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Suggested polling delay in seconds while the job is not terminal.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/admin/sources:
    get:
      tags: [Admin]
      summary: List configured news sources
      operationId: listSources
      x-required-role: admin
      parameters:
        - name: enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Configured sources without secret values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'
    post:
      tags: [Admin]
      summary: Create a news source configuration
      description: Credentials must already exist in Lockbox; the API accepts only the secret identifier.
      operationId: createSource
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
      responses:
        '201':
          description: Source configuration was created. Validate it before enabling production polling.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URL of the created source.
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/admin/sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Admin]
      summary: Get source configuration without secret values
      operationId: getSource
      x-required-role: admin
      responses:
        '200':
          description: Source configuration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'
    patch:
      tags: [Admin]
      summary: Update mutable source settings
      operationId: updateSource
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SourcePatch'
      responses:
        '200':
          description: Updated source configuration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/admin/sources/{source_id}/validate:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [Admin]
      summary: Validate source connectivity without enabling it
      operationId: validateSource
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Validation job was accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URL of the asynchronous validation job.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /v1/admin/scoring-config:
    get:
      tags: [Admin]
      summary: Get the active scoring configuration
      operationId: getScoringConfig
      x-required-role: admin
      responses:
        '200':
          description: Active immutable configuration version.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'
    put:
      tags: [Admin]
      summary: Create and activate a new scoring configuration version
      operationId: replaceScoringConfig
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringConfigDraft'
      responses:
        '201':
          description: New immutable configuration version is active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /health/live:
    get:
      tags: [Health]
      summary: Process liveness probe
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

  /health/ready:
    get:
      tags: [Health]
      summary: Dependency readiness probe
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: One or more required dependencies are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-yc-apigateway-integration:
        $ref: '#/components/x-yc-apigateway-integrations/api'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    adminApiKey:
      type: apiKey
      in: header
      name: X-EventEdge-Admin-Key

  x-yc-apigateway-integrations:
    api:
      type: serverless_containers
      container_id: ${API_CONTAINER_ID}
      service_account_id: ${GATEWAY_SERVICE_ACCOUNT_ID}

  headers:
    XRequestId:
      description: End-to-end request identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ETag:
      description: Version of the returned representation.
      schema:
        type: string

  parameters:
    SignalId:
      name: signal_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^sig_[0-9A-HJKMNP-TV-Z]{26}$'
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{2,63}$'
    TickerPath:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{1,12}$'
        example: SBER
    TickerQuery:
      name: ticker
      in: query
      schema:
        type: string
        pattern: '^[A-Z0-9]{1,12}$'
        example: SBER
    TickerQueryRequired:
      name: ticker
      in: query
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{1,12}$'
        example: SBER
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned in `meta.next_cursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client-generated key retained for at least 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Prevents lost updates of mutable administrative state.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request syntax or parameters are invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal does not have the required role.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The command conflicts with existing resource state or idempotency data.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "If-Match does not match the active representation."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured ingestion limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Syntax is valid but the configuration fails business validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate or monthly processing allowance was exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required upstream data source is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AssessmentFactor:
      type: object
      additionalProperties: false
      required: [code, label, contribution, role, available]
      properties:
        code:
          type: string
        label:
          type: string
        value: {}
        display_value:
          type: string
        contribution:
          type: number
        role:
          type: string
          enum: [direction, confidence]
        available:
          type: boolean
        source_news_id:
          type: string
          nullable: true

    MarketContext:
      type: object
      additionalProperties: false
      required: [as_of, is_signal, bias_direction, score, confidence, factor_contributions, source]
      properties:
        as_of:
          type: string
          format: date-time
        is_signal:
          type: boolean
          enum: [false]
        bias_direction:
          $ref: '#/components/schemas/SignalDirection'
        score:
          type: number
          minimum: -100
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        factor_contributions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentFactor'
        source:
          $ref: '#/components/schemas/MarketDataSource'

    Assessment:
      type: object
      additionalProperties: true
      required: [id, ticker, as_of, assessment_type, direction, bias_direction, action, horizon, score, confidence, factor_contributions, market, market_context, market_scenario, news_signal, model_version, config_version]
      properties:
        id:
          type: string
        ticker:
          type: string
        as_of:
          type: string
          format: date-time
        assessment_type:
          type: string
          enum: [hybrid, quant]
        direction:
          $ref: '#/components/schemas/SignalDirection'
        bias_direction:
          $ref: '#/components/schemas/SignalDirection'
        action:
          $ref: '#/components/schemas/SignalAction'
        horizon:
          $ref: '#/components/schemas/Horizon'
        score:
          type: number
          minimum: -100
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        factor_contributions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentFactor'
        market:
          type: object
          additionalProperties: true
        market_context:
          $ref: '#/components/schemas/MarketContext'
        market_scenario:
          allOf:
            - $ref: '#/components/schemas/ScenarioRange'
          nullable: true
        news_signal:
          allOf:
            - $ref: '#/components/schemas/Signal'
          nullable: true
        model_version:
          type: string
        config_version:
          type: integer
          minimum: 1

    AssessmentListResponse:
      type: object
      additionalProperties: false
      required: [data, errors, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true
          required: [snapshot_id, snapshot_as_of, generated_at]
          properties:
            snapshot_id:
              type: string
              pattern: '^market_[a-f0-9]{24}$'
            snapshot_as_of:
              type: string
              format: date-time
              nullable: true
            generated_at:
              type: string
              format: date-time

    EvalResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [summary, breakdowns, relationships, quality_series, outcomes, materiality]
        meta:
          type: object
          additionalProperties: true

    RelatedSignal:
      type: object
      additionalProperties: false
      required: [id, ticker, direction, action, score, confidence]
      properties:
        id:
          type: string
        ticker:
          type: string
        direction:
          $ref: '#/components/schemas/SignalDirection'
        action:
          $ref: '#/components/schemas/SignalAction'
        score:
          type: number
          minimum: -100
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1

    MaterialityPrediction:
      type: object
      additionalProperties: false
      required:
        - id
        - ticker
        - status
        - reason
        - raw_probability
        - probability
        - selected_at_coverage_pct
        - eligible_for_ranking
        - missing_features
        - decision_at
        - data_cutoff_at
        - model_id
        - model_version
        - artifact_payload_sha256
        - feature_schema_version
        - created_at
        - updated_at
        - outcome_4h
      properties:
        id:
          type: string
        ticker:
          type: string
        status:
          type: string
          enum: [ready, deferred]
        reason:
          type: string
          nullable: true
          enum: [instrument_not_found, market_data_unavailable, invalid_market_data]
        raw_probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        selected_at_coverage_pct:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 100
        eligible_for_ranking:
          type: boolean
          description: >-
            True only for the retained model domain with an available
            five-minute abnormal-reaction feature.
        missing_features:
          type: array
          items:
            type: string
        decision_at:
          type: string
          format: date-time
        data_cutoff_at:
          type: string
          format: date-time
        model_id:
          type: string
        model_version:
          type: string
        artifact_payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        feature_schema_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        outcome_4h:
          type: object
          additionalProperties: true
          nullable: true

    NewsMateriality:
      type: object
      additionalProperties: false
      required:
        - status
        - mode
        - available_after
        - max_probability
        - model_version
        - predictions
      properties:
        status:
          type: string
          enum: [pending, deferred, ready]
        mode:
          type: string
          enum: [shadow, rank]
        available_after:
          type: string
          format: date-time
        max_probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        model_version:
          type: string
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/MaterialityPrediction'

    News:
      type: object
      additionalProperties: false
      required:
        - id
        - source_id
        - external_id
        - published_at
        - received_at
        - title
        - url
        - content
        - language
        - source_metadata
        - created_at
        - related_signals
      properties:
        id:
          type: string
        source_id:
          type: string
        external_id:
          type: string
        published_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
        content:
          type: string
          maxLength: 200000
        language:
          type: string
          enum: [ru, en]
        source_metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        related_signals:
          type: array
          items:
            $ref: '#/components/schemas/RelatedSignal'
        market_materiality:
          $ref: '#/components/schemas/NewsMateriality'

    SignalDirection:
      type: string
      enum: [up, neutral, down]

    SignalAction:
      type: string
      enum: [consider_buy, no_action, review_position]

    SignalStatus:
      type: string
      enum: [active, expired, superseded, invalidated]

    Horizon:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: integer
          minimum: 1
          maximum: 90
        unit:
          type: string
          enum: [hours, calendar_days, trading_days]

    FactorContribution:
      type: object
      additionalProperties: false
      required: [code, label, contribution]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        label:
          type: string
          maxLength: 120
        contribution:
          type: number
          format: double
          minimum: -1
          maximum: 1

    SignalFactorChange:
      type: object
      additionalProperties: false
      required: [code, label, previous_contribution, current_contribution, delta]
      properties:
        code:
          type: string
        label:
          type: string
        previous_contribution:
          type: number
          nullable: true
        current_contribution:
          type: number
          nullable: true
        delta:
          type: number
          nullable: true

    SignalChange:
      type: object
      additionalProperties: false
      required: [previous_signal_id, from_direction, to_direction, direction_changed, score_delta, confidence_delta, primary_factor_change, factor_changes]
      properties:
        previous_signal_id:
          type: string
        from_direction:
          $ref: '#/components/schemas/SignalDirection'
        to_direction:
          $ref: '#/components/schemas/SignalDirection'
        direction_changed:
          type: boolean
        score_delta:
          type: number
        confidence_delta:
          type: number
        primary_factor_change:
          allOf:
            - $ref: '#/components/schemas/SignalFactorChange'
          nullable: true
        factor_changes:
          type: array
          items:
            $ref: '#/components/schemas/SignalFactorChange'

    SignalHistoryEvent:
      type: object
      additionalProperties: false
      required: [signal, change_from_previous]
      properties:
        signal:
          $ref: '#/components/schemas/Signal'
        change_from_previous:
          allOf:
            - $ref: '#/components/schemas/SignalChange'
          nullable: true

    SignalEvidence:
      type: object
      additionalProperties: false
      required: [id, source_id, title, url, published_at, received_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
        published_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time

    SignalProvenance:
      type: object
      additionalProperties: false
      required: [method, decision_at, data_cutoff_at, model_version, config_version, evidence_status, evidence_expected, evidence_resolved]
      properties:
        method:
          type: string
          enum: [deterministic_news_event_scoring]
        decision_at:
          type: string
          format: date-time
        data_cutoff_at:
          type: string
          format: date-time
        model_version:
          type: string
        config_version:
          type: integer
          minimum: 1
        evidence_status:
          type: string
          enum: [complete, partial, missing]
        evidence_expected:
          type: integer
          minimum: 0
        evidence_resolved:
          type: integer
          minimum: 0

    SignalTarget:
      type: object
      additionalProperties: false
      required: [type, id, label]
      properties:
        type:
          type: string
          enum: [instrument, sector, market]
        id:
          type: string
        label:
          type: string

    Signal:
      type: object
      additionalProperties: false
      required:
        - id
        - ticker
        - target
        - as_of
        - data_cutoff_at
        - status
        - direction
        - action
        - horizon
        - score
        - strength
        - confidence
        - summary
        - factor_contributions
        - evidence_refs
        - expires_at
        - invalidation_conditions
        - model_version
        - config_version
        - created_at
      properties:
        id:
          type: string
          example: sig_01JZK6K5GDX90Q2X8C0R4D7M9P
        ticker:
          type: string
          example: SBER
        target:
          $ref: '#/components/schemas/SignalTarget'
        as_of:
          type: string
          format: date-time
        data_cutoff_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SignalStatus'
        direction:
          $ref: '#/components/schemas/SignalDirection'
        action:
          $ref: '#/components/schemas/SignalAction'
        horizon:
          $ref: '#/components/schemas/Horizon'
        score:
          type: number
          format: double
          minimum: -100
          maximum: 100
        strength:
          type: number
          format: double
          minimum: 0
          maximum: 1
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 800
        factor_contributions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FactorContribution'
        evidence_refs:
          type: array
          maxItems: 50
          items:
            type: string
        evidence:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SignalEvidence'
        provenance:
          $ref: '#/components/schemas/SignalProvenance'
        expires_at:
          type: string
          format: date-time
        invalidation_conditions:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 300
        model_version:
          type: string
          example: baseline-0.1.0
        config_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time

    Evidence:
      type: object
      additionalProperties: false
      required: [news_id, source_id, published_at, title, url, content_hash]
      properties:
        news_id:
          type: string
        source_id:
          type: string
        published_at:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
        content_hash:
          type: string
          description: Hash used to prove which source representation was analyzed.

    EventSource:
      type: object
      additionalProperties: false
      required: [source_id, url]
      properties:
        source_id:
          type: string
        url:
          type: string
          format: uri

    EventRelatedSignal:
      type: object
      additionalProperties: false
      required: [id, ticker, target, direction, score, confidence, status]
      properties:
        id:
          type: string
        ticker:
          type: string
        target:
          $ref: '#/components/schemas/SignalTarget'
        direction:
          $ref: '#/components/schemas/SignalDirection'
        score:
          type: number
          minimum: -100
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          $ref: '#/components/schemas/SignalStatus'

    Event:
      type: object
      additionalProperties: false
      required:
        - id
        - event_time
        - detected_at
        - event_type
        - title
        - summary
        - published_at
        - source_id
        - source_url
        - scope
        - scope_label
        - tickers
        - sectors
        - reason
        - materiality
        - evidence
        - news_ids
        - sources
        - source_count
        - related_signals
        - extractor_version
      properties:
        id:
          type: string
          example: evt_01JZK5Y4V2JABR9N4F0S7Q2XWC
        event_time:
          type: string
          format: date-time
        detected_at:
          type: string
          format: date-time
        event_type:
          type: string
          maxLength: 80
