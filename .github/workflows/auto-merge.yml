name: Auto merge trusted agent PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Squash merge the exact tested revision
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$pr_number" ]]; then
            echo "No pull request is attached to the completed CI run; skipping"
            exit 0
          fi

          pr="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          blocked="$(jq -r '[.labels[].name] | any(. == "do-not-merge")' <<<"$pr")"

          if [[ "$head_sha" != "$RUN_HEAD_SHA" ]]; then
            echo "PR head changed after this CI run; a newer run must pass"
            exit 0
          fi
          if [[ "$head_ref" != agent/* || "$head_repo" != "$REPOSITORY" || "$base_ref" != "main" ]]; then
            echo "PR is outside the trusted agent/* -> main policy; skipping"
            exit 0
          fi
          if [[ "$draft" == "true" || "$blocked" == "true" ]]; then
            echo "Draft or do-not-merge PR; skipping"
            exit 0
          fi

          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch
