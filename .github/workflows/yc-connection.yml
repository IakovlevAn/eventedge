name: Yandex Cloud connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        id: github-oidc
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const audience = `https://github.com/${context.repo.owner}`;
            const token = await core.getIDToken(audience);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`OIDC issuer: ${claims.iss}`);
            core.info(`OIDC audience: ${claims.aud}`);
            core.info(`OIDC subject: ${claims.sub}`);
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange OIDC token for Yandex Cloud IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.github-oidc.outputs.token }}
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${YC_SERVICE_ACCOUNT_ID}" ]]; then
            echo "Repository variable YC_SERVICE_ACCOUNT_ID is not configured" >&2
            exit 1
          fi

          http_code="$(curl --silent --show-error \
            --output "${RUNNER_TEMP}/yc-token-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            'https://auth.yandex.cloud/oauth/token')"

          if [[ "${http_code}" != "200" ]]; then
            echo "Yandex Cloud token exchange failed with HTTP ${http_code}" >&2
            jq -c 'del(.access_token, .refresh_token)' "${RUNNER_TEMP}/yc-token-response.json" >&2
            exit 1
          fi

          iam_token="$(jq -er '.access_token' "${RUNNER_TEMP}/yc-token-response.json")"
          expires_in="$(jq -er '.expires_in' "${RUNNER_TEMP}/yc-token-response.json")"
          echo "::add-mask::${iam_token}"
          echo "Yandex Cloud OIDC exchange succeeded; token lifetime: ${expires_in}s"
