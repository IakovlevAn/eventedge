name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact tested main commit to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      IMAGE_URL: cr.yandex/${{ vars.YC_REGISTRY_ID }}/eventedge-api:${{ inputs.deploy_sha }}
      YC_CONTAINER_ID: ${{ vars.YC_CONTAINER_ID }}
      YC_WORKER_CONTAINER_ID: ${{ vars.YC_WORKER_CONTAINER_ID }}
      YC_GATEWAY_ID: ${{ vars.YC_GATEWAY_ID }}
      YC_GATEWAY_SERVICE_ACCOUNT_ID: ${{ vars.YC_GATEWAY_SERVICE_ACCOUNT_ID }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_RUNTIME_SERVICE_ACCOUNT_ID: ${{ vars.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
      EVENTEDGE_API_URL: ${{ vars.EVENTEDGE_API_URL }}
      YDB_ENDPOINT: ${{ vars.YDB_ENDPOINT }}
      YDB_DATABASE: ${{ vars.YDB_DATABASE }}
      EVENTEDGE_ADMIN_KEY: ${{ secrets.EVENTEDGE_ADMIN_KEY }}
    steps:
      - name: Check out the tested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Request GitHub OIDC token
        id: github-oidc
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const audience = `https://github.com/${context.repo.owner}`;
            const token = await core.getIDToken(audience);
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange OIDC token for Yandex Cloud IAM token
        id: yandex-iam
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.github-oidc.outputs.token }}
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/yc-token-response.json"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            'https://auth.yandex.cloud/oauth/token')"

          if [[ "$http_code" != "200" ]]; then
            echo "Yandex Cloud token exchange failed with HTTP ${http_code}" >&2
            jq -c 'del(.access_token, .refresh_token)' "$response_file" >&2
            exit 1
          fi

          iam_token="$(jq -er '.access_token' "$response_file")"
          echo "::add-mask::${iam_token}"
          echo "token=${iam_token}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        env:
          IAM_TOKEN: ${{ steps.yandex-iam.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build --platform linux/amd64 --tag "$IMAGE_URL" .
          docker push "$IMAGE_URL"

      - name: Apply YDB schema migrations
        env:
          YDB_ACCESS_TOKEN: ${{ steps.yandex-iam.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --env YDB_ENDPOINT \
            --env YDB_DATABASE \
            --env YDB_ACCESS_TOKEN \
            "$IMAGE_URL" \
            python -m eventedge.migrate

      - name: Deploy budget-capped serverless revision
        env:
          IAM_TOKEN: ${{ steps.yandex-iam.outputs.token }}
        run: python scripts/deploy_serverless.py

      - name: Deploy news collection triggers
        env:
          IAM_TOKEN: ${{ steps.yandex-iam.outputs.token }}
          PYTHONPATH: src
        run: python -m scripts.deploy_triggers

      - name: Deploy API Gateway specification
        env:
          IAM_TOKEN: ${{ steps.yandex-iam.outputs.token }}
        run: python -m scripts.deploy_gateway

      - name: Smoke test through API Gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 25 \
              "${EVENTEDGE_API_URL}/health/ready" \
              | jq -e --arg revision "$DEPLOY_SHA" \
                '.status == "ok" and .revision == $revision' >/dev/null; then
              echo "Production API is ready on revision ${DEPLOY_SHA}"
              exit 0
            fi
            echo "Waiting for production revision (${attempt}/12)"
            sleep 5
          done
          echo "Production API did not become ready" >&2
          exit 1

      - name: Smoke test batch market route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --max-time 30 \
              "${EVENTEDGE_API_URL}/v1/instruments/snapshots?tickers=SBER" \
              | jq -e '.meta.requested == 1 and .meta.returned == 1' >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "6" ]]; then exit 1; fi
            sleep 5
          done
          echo "Production batch market route is ready"

      - name: Smoke test assessments and evals
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --max-time 55 \
              "${EVENTEDGE_API_URL}/v1/assessments" \
              | jq -e '
                  .meta.requested == 20
                  and .meta.returned >= 12
                  and ((.meta.returned + (.errors | length)) == .meta.requested)
                  and (([.data[].ticker, .errors[].ticker] | unique | length) == 20)
                  and ([.errors[].code] | all(
                    . == "MARKET_DATA_UNAVAILABLE" or . == "INSTRUMENT_NOT_FOUND"
                  ))
                ' >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "6" ]]; then exit 1; fi
            sleep 5
          done
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --max-time 45 \
              "${EVENTEDGE_API_URL}/v1/evals" \
              | jq -e '.data | has("summary") and has("breakdowns") and has("relationships") and has("quality_series") and has("outcomes")' >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "6" ]]; then exit 1; fi
            sleep 5
          done
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --max-time 45 \
              "${EVENTEDGE_API_URL}/v1/evals/export?format=csv&dataset=outcomes" \
              --output /tmp/eventedge-evals.csv \
              && grep -q 'signal_id,ticker,signal_as_of' /tmp/eventedge-evals.csv; then
              break
            fi
            if [[ "${attempt}" == "6" ]]; then exit 1; fi
            sleep 5
          done
          echo "Production assessment, eval and export routes are ready"

      - name: Smoke test source registry and market events
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --max-time 30 \
              "${EVENTEDGE_API_URL}/v1/sources" \
              | jq -e '.meta.telegram_limit == 18 and (.data | length) > 0' >/dev/null \
              && curl --fail --silent --show-error \
                --max-time 30 \
                "${EVENTEDGE_API_URL}/v1/events?limit=1" \
              | jq -e '.meta.limit == 1 and has("data")' >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "6" ]]; then exit 1; fi
            sleep 5
          done
          echo "Production source registry and market-event routes are ready"

      - name: Smoke test concurrent dashboard reads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            check_dir="$(mktemp -d)"
            curl --fail --silent --show-error --max-time 30 \
              "${EVENTEDGE_API_URL}/v1/evals" >"${check_dir}/evals.json" &
            evals_pid=$!
            curl --fail --silent --show-error --max-time 30 \
              "${EVENTEDGE_API_URL}/v1/sources" >"${check_dir}/sources.json" &
            sources_pid=$!
            curl --fail --silent --show-error --max-time 40 \
              "${EVENTEDGE_API_URL}/v1/assessments" >"${check_dir}/assessments.json" &
            assessments_pid=$!
            concurrent_status=0
            wait "$evals_pid" || concurrent_status=1
            wait "$sources_pid" || concurrent_status=1
            wait "$assessments_pid" || concurrent_status=1
            if [[ "$concurrent_status" == "0" ]] \
              && jq -e '.meta.evaluation_scope == "directional_signals_only"' \
                "${check_dir}/evals.json" >/dev/null \
              && jq -e '.data | length >= 6' "${check_dir}/sources.json" >/dev/null \
              && jq -e '
                  .meta.requested == 20
                  and .meta.returned >= 12
                  and ((.meta.returned + (.errors | length)) == .meta.requested)
                  and (([.data[].ticker, .errors[].ticker] | unique | length) == 20)
                ' "${check_dir}/assessments.json" >/dev/null; then
              echo "Concurrent production dashboard reads are ready"
              exit 0
            fi
            echo "Concurrent dashboard read attempt ${attempt}/3 did not settle"
            sleep 5
          done
          echo "Concurrent production dashboard reads are unhealthy" >&2
          exit 1

      - name: Smoke test web application
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error --max-time 10 "${EVENTEDGE_API_URL}/")"
          grep -Fq '<title>EventEdge — сигналы российского рынка</title>' <<<"$page"
          echo "Production web application is ready"
