[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eventedge"
version = "0.1.0"
description = "API-first stock signal platform for the Russian market"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "ydb>=3.30,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7.2,<1",
    "pytest>=8.4,<10",
    "pyyaml>=6.0.2,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventedge = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
