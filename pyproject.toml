[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eventedge"
version = "0.1.0"
description = "API-first Russian-market news aggregator and signal service"
readme = "PACKAGE.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pyyaml>=6.0.2,<7",
    "requests>=2.34,<3",
    "uvicorn[standard]>=0.35,<1",
    "ydb>=3.30,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7.2,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "scikit-learn>=1.7,<2",
]
export = [
    "ydb[yc]>=3.30,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["eventedge_research*"]

[tool.setuptools.package-data]
eventedge = ["static/*", "static/assets/*", "static/brands/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
