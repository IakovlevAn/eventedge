openapi: 3.0.0
info:
  title: EventEdge API Gateway
  version: 0.1.0
  description: Bootstrap gateway for the EventEdge production API.
paths:
  /:
    get:
      operationId: getWebApp
      responses:
        '200':
          description: EventEdge web application.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /assets/{asset}:
    get:
      operationId: getWebAsset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Versioned web asset.
        '404':
          description: Asset not found.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /brands/{asset}:
    get:
      operationId: getCompanyBrandAsset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Local company logo.
        '404':
          description: Asset not found.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /favicon.png:
    get:
      operationId: getFavicon
      responses:
        '200':
          description: EventEdge favicon.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /apple-touch-icon.png:
    get:
      operationId: getAppleTouchIcon
      responses:
        '200':
          description: EventEdge touch icon.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies are available.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/signals:
    get:
      operationId: listSignals
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: min_confidence
          in: query
          schema:
            type: number
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Signal list.
        '304':
          description: Cached representation is current.
        '400':
          description: Invalid request.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/news:
    get:
      operationId: listNews
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: News list with related signals.
        '400':
          description: Invalid request.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/instruments/snapshots:
    get:
      operationId: listInstrumentSnapshots
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch of current MOEX instrument snapshots.
        '400':
          description: Invalid tickers.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/instruments/{ticker}/snapshot:
    get:
      operationId: getInstrumentSnapshot
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Current MOEX instrument snapshot and scenario range.
        '304':
          description: Cached representation is current.
        '404':
          description: Instrument not found.
        '503':
          description: Market-data source is unavailable.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/instruments/{ticker}/candles:
    get:
      operationId: getInstrumentCandles
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: interval
          in: query
          schema:
            type: integer
            enum: [10]
        - name: lookback_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
      responses:
        '200':
          description: Intraday MOEX OHLCV candles.
        '400':
          description: Invalid ticker or candle parameters.
        '503':
          description: Market-data source is unavailable.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
  /v1/signals/{signal_id}:
    get:
      operationId: getSignal
      parameters:
        - name: signal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signal revision.
        '400':
          description: Invalid identifier.
        '404':
          description: Signal not found.
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: __API_CONTAINER_ID__
        service_account_id: __GATEWAY_SERVICE_ACCOUNT_ID__
