version: 1
currency: RUB
period: monthly
monthly_budget: 15000
monthly_soft_cap: 12000
notifications:
  thresholds_percent: [25, 50, 70, 85, 95]
  recipients:
    - cloud_owner
enforcement:
  billing_budget: notification_only
  automatic_shutdown: false
runtime_caps:
  serverless_container:
    memory_mb: 4096
    cores: 2
    concurrency: 7
    min_instances: 1
    zone_instances_limit: 1
    zone_requests_limit: 7
    execution_timeout_seconds: 180
  collection_worker:
    memory_mb: 4096
    cores: 2
    concurrency: 1
    min_instances: 0
    zone_instances_limit: 3
    zone_requests_limit: 3
    execution_timeout_seconds: 180
  ydb_serverless:
    throttling_rcu_limit: 500
    storage_size_limit_mb: 1024
    provisioned_rcu: 0
  source_collection:
    max_telegram_channels: 18
    static_telegram_poll_interval_seconds: 300
    managed_telegram_poll_interval_seconds: 300
    llm_analysis: economic_candidates_only
  historical_backfill:
    model_version: signal-engine-0.6.1
    batch_size: 12
    max_parallel_llm_requests: 4
    interval_seconds: 600
notes:
  - The Yandex Cloud billing budget sends alerts but does not stop resource consumption.
  - One provisioned 2-vCPU API instance per active zone serves up to seven concurrent I/O-bound requests; shared assessment snapshots are canonicalized in YDB across instances.
  - Public endpoints serve the last successful market snapshot immediately and refresh it every 60 seconds in the background.
  - A cold API instance finishes the default news projection before reporting startup complete, and concurrent projection misses share one single-flight task.
  - News collection and LLM analysis run in a separate non-provisioned worker so timer jobs cannot block the public API.
  - The pay-per-use worker uses 2 vCPU and 4 GiB per instance and scales overlapping timer lanes across up to three isolated instances; collection is raw-only, YDB has an eight-session pool, and semantic LLM work remains single-flight in maintenance.
  - Broad RSS and Telegram sources use five stable minute buckets so each source keeps a five-minute interval without a connection burst.
  - At 12000 RUB, freeze resource increases and review the current-month forecast before the 15000 RUB hard notification threshold.
  - Historical reprocessing is capped at one targetable candidate per five-minute maintenance run so even a cold batch fits the trigger's 30-second request window without cancellation.
  - Automatic shutdown requires a separate explicitly approved runbook or trigger.
