version: 1
currency: RUB
period: monthly
monthly_budget: 15000
monthly_soft_cap: 12500
notifications:
  thresholds_percent: [25, 50, 70, 85, 95]
  recipients:
    - cloud_owner
enforcement:
  billing_budget: notification_only
  automatic_shutdown: false
runtime_caps:
  serverless_container:
    memory_mb: 1024
    cores: 1
    concurrency: 4
    min_instances: 1
    zone_instances_limit: 2
    zone_requests_limit: 8
    execution_timeout_seconds: 180
  collection_worker:
    memory_mb: 1024
    cores: 1
    concurrency: 1
    min_instances: 0
    zone_instances_limit: 1
    zone_requests_limit: 1
    execution_timeout_seconds: 180
  source_collection:
    max_telegram_channels: 18
    priority_telegram_poll_interval_seconds: 60
    managed_telegram_poll_interval_seconds: 300
    llm_analysis: economic_candidates_only
  historical_backfill:
    model_version: signal-engine-0.5.0
    batch_size: 12
    max_parallel_llm_requests: 4
    interval_seconds: 600
notes:
  - The Yandex Cloud billing budget sends alerts but does not stop resource consumption.
  - One provisioned API instance serves the normal UI load; a second instance is available only for bursts.
  - Public endpoints serve the last successful market snapshot immediately and refresh it every 60 seconds in the background.
  - Market snapshot prefetch starts after application startup so a cold instance can serve static UI without waiting for YDB.
  - News collection and LLM analysis run in a separate non-provisioned worker so timer jobs cannot block the public API.
  - The pay-per-use worker processes one timer job at a time so collection waves cannot compete for YDB sessions.
  - At 12500 RUB, freeze resource increases and review the current-month forecast.
  - Historical reprocessing is capped at 12 candidates per maintenance run and 4 parallel LLM calls.
  - Automatic shutdown requires a separate explicitly approved runbook or trigger.
