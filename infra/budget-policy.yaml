version: 1
currency: RUB
period: monthly
monthly_budget: 10000
monthly_soft_cap: 8500
notifications:
  thresholds_percent: [25, 50, 70, 85, 95]
  recipients:
    - cloud_owner
enforcement:
  billing_budget: notification_only
  automatic_shutdown: false
runtime_caps:
  serverless_container:
    memory_mb: 1024
    cores: 1
    concurrency: 8
    min_instances: 1
    zone_instances_limit: 3
    zone_requests_limit: 24
    execution_timeout_seconds: 180
  collection_worker:
    memory_mb: 1024
    cores: 1
    concurrency: 1
    min_instances: 0
    zone_instances_limit: 2
    zone_requests_limit: 2
    execution_timeout_seconds: 180
  source_collection:
    max_telegram_channels: 18
    telegram_poll_interval_seconds: 60
    llm_analysis: signal_candidates_only
notes:
  - The Yandex Cloud billing budget sends alerts but does not stop resource consumption.
  - One provisioned instance serves a normal page load; up to two burst instances exist only under exceptional load.
  - News collection and LLM analysis run in a separate non-provisioned worker so timer jobs cannot block the public API.
  - At 8500 RUB, freeze resource increases and review the current-month forecast.
  - Automatic shutdown requires a separate explicitly approved runbook or trigger.
